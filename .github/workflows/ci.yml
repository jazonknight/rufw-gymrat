name: GymRat CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-build:
    name: Build & Test GymRat Engine
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Unit Test Suite
        run: go test -v ./...

      - name: Build GymRat Binary
        run: go build -o gymrat main.go

      - name: Verify Docker Container Build
        run: docker build -t gymrat:ci .
