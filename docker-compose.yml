version: '3.8'

services:
  gymrat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gymrat-app
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${PORT:-9876}:8080"
    environment:
      - SERVER_MODE=true
      - PORT=8080
      - SESSIONS_DIR=/app/data/sessions
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    volumes:
      # Optional persistence directory when running in disk storage mode
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/exercises"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

 
