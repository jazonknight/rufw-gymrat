# GymRat GitLab CI/CD Pipeline Configuration
# Automated multi-architecture Docker build and push to Docker Hub

stages:
  - test
  - build

test_suite:
  stage: test
  image: golang:1.23-alpine
  script:
    - go test -v ./...

build_multiarch_docker:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u "$DOCKER_HUB_USERNAME" -p "$DOCKER_HUB_TOKEN"
  script:
    - docker buildx create --use
    - docker buildx build --platform linux/amd64,linux/arm64 -t $DOCKER_HUB_USERNAME/rufw-gymrat:latest --push .
  only:
    - main
    - master
